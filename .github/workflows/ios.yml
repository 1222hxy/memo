# 在 GitHub 的 macOS 机器上编译 iOS 应用，并用你自己的证书签名，产出可安装的 .ipa。
#
# 思路：先「不签名」归档（避免 CocoaPods 依赖也被要求签名），再用证书和描述文件
# 手动给 .app 签名并打包成 .ipa。以后加锁屏组件（App Extension）时，再为它补一个描述文件。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   Secrets
#     IOS_CERTIFICATE_P12_BASE64    签名证书 .p12 的 base64
#     IOS_CERTIFICATE_PASSWORD      .p12 的密码
#     IOS_PROVISIONING_PROFILE_BASE64  描述文件 .mobileprovision 的 base64
#   Variables
#     MEMO_BUNDLE_ID                与描述文件匹配的 Bundle ID，例如 com.yourname.memo
#
# 在 Windows PowerShell 里生成 base64：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.p12")) | Set-Clipboard

name: iOS build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'development = 开发版（连电脑上的 Metro 热更新）；release = 独立运行的正式版'
        type: choice
        options: [development, release]
        default: development

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MEMO_BUNDLE_ID: ${{ vars.MEMO_BUNDLE_ID }}
      CONFIGURATION: ${{ inputs.profile == 'release' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$MEMO_BUNDLE_ID" ]; then
            echo "::error::请先在仓库 Variables 里设置 MEMO_BUNDLE_ID"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test core
        run: pnpm --filter @memo/core test

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Archive (unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Memo.xcworkspace \
            -scheme Memo \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Memo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify || {
              echo "::error::xcodebuild archive 失败"; exit 1;
            }

      - name: Import certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then echo "::error::证书里没有可用的签名身份"; exit 1; fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "App ID:  $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"

      - name: Sign and package .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/Memo.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # 先签内部的 framework / dylib，再签 App 本体。
          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --sign "$IDENTITY" --timestamp=none "$item"
            done
          codesign --force --sign "$IDENTITY" --timestamp=none \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          codesign --verify --deep --strict "$APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "Memo-${{ inputs.profile }}.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-${{ inputs.profile }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/Memo-${{ inputs.profile }}.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
